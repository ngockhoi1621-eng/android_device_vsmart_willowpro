name: Build TWRP for Vsmart Star 4

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Recovery
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v2

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo wget curl

      - name: Initialize Repo
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          mkdir twrp && cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-11
          repo sync -j4 --no-clone-bundle --no-tags

      - name: Insert Device Tree
        run: |
          mkdir -p twrp/device/vsmart/willowpro
          cp -r * twrp/device/vsmart/willowpro/ || true

      - name: Start Compilation
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          . build/envsetup.sh
          lunch omni_willowpro-eng
          mka recoveryimage

      - name: Upload Artifact
        uses: actions/upload-artifact@v2
        with:
          name: recovery-willowpro
          path: twrp/out/target/product/willowpro/recovery.img
